name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run verification and npm publish --dry-run without publishing'
        type: boolean
        default: true
      dist_tag:
        description: 'npm dist-tag (latest, next, beta)'
        type: string
        default: 'latest'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Verify & Publish @kerno/* Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Setup Node.js (npm registry)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Full Verification & Tarball Audit
        run: pnpm release:verify

      - name: Publish Packages (Dry Run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: pnpm release:publish -- --dry-run --skip-verify --tag "${{ inputs.dist_tag || 'latest' }}"

      - name: Publish Packages to npm (OIDC Provenance)
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm release:publish -- --execute --skip-verify --tag "${{ inputs.dist_tag || 'latest' }}"

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "Kerno $TAG" \
            --generate-notes \
            reports/bundle-size.md
